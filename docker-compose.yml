services:
  postgres:
    image: postgres:15
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
      POSTGRES_DB: aegis_trace
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_trace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
